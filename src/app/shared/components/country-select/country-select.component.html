<label class="sr-only" [attr.for]="id" i18n="@@countrySelect.label">País</label>
<select
  [id]="id"
  [value]="value"
  (change)="onChange($event.target)"
  autocomplete="tel-country-code"
  class="w-full sm:w-28 shrink-0 truncate bg-dark-bg border border-dark-border/80 rounded-lg px-2 py-3 text-sm text-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-300"
>
  @for (country of countries; track country.iso2) {
  <option [value]="country.iso2">{{ country.flag }} {{ country.name }} (+{{ country.dialCode }})</option>
  }
</select>
